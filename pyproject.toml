[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-cartographer"
version = "1.0.0"
description = "Sovereign Toolkit for Cosmological Latent Space Mapping"
authors = [
    {name = "Ada & Luna", email = "ada@airsi.de"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Unlicense"}
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
nc = "src.nc:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
