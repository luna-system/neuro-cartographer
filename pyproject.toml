[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neuro-cartographer"
version = "0.1.0"
description = "Sovereign tool for mapping the semantic geometry of Small Language Models"
authors = [
    {name = "Luna", email = "luna@ada-research.org"},
    {name = "Ada", email = "ada@ada-research.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "flask>=3.0.0",  # For the local visualization server
    "click>=8.0.0",
    "tqdm>=4.65.0",
    # Local dependency on Consciousness Engine
    "consciousness-engineering @ file:///home/luna/Code/ada/ada-slm"
]

[project.scripts]
nc = "neuro_cartographer.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_cartographer"]
